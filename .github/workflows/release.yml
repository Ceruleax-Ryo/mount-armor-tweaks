name: Release

# Runs when a version tag such as v1.2.0 or v1.3.0-beta.1 is pushed.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6

      # Fails if the tag does not match mod.version or CHANGELOG.md has no section for it.
      - name: Prepare release notes
        run: |
          mkdir -p build
          bash .github/scripts/release-notes.sh "${GITHUB_REF_NAME#v}" > build/release-notes.md
          cat build/release-notes.md

      - name: Build all nodes
        run: ./gradlew build

      # Platforms without a project ID in stonecutter.properties.toml are skipped.
      - name: Publish to Modrinth and CurseForge
        run: ./gradlew publishMods
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}

      - name: Create GitHub release
        run: |
          mapfile -t jars < <(find versions -path '*/build/libs/*.jar' ! -name '*-sources.jar' | sort)
          flags=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" "${jars[@]}" \
            --title "$GITHUB_REF_NAME" \
            --notes-file build/release-notes.md \
            --verify-tag "${flags[@]}"
        env:
          GH_TOKEN: ${{ github.token }}
