name: Bug report
description: Something does not work as described, crashes, or conflicts with another mod.
labels: [bug]
body:
  - type: input
    id: mod-version
    attributes:
      label: Mod version
      description: The full file name of the jar is best.
      placeholder: mountarmortweaks-fabric-1.0.0+mc26.3.jar
    validations:
      required: true
  - type: input
    id: minecraft-version
    attributes:
      label: Minecraft version
      placeholder: "26.3"
    validations:
      required: true
  - type: input
    id: loader
    attributes:
      label: Mod loader and version
      placeholder: Fabric Loader 0.20.1
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Where does it happen?
      options:
        - Dedicated server
        - Singleplayer (integrated server)
        - Client connected to a server
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: The smallest setup that shows the problem. A world download or schematic helps for contraptions.
    validations:
      required: true
  - type: textarea
    id: other-mods
    attributes:
      label: Other mods installed
      description: Include versions. Please say whether the problem still happens with only this mod installed.
  - type: textarea
    id: logs
    attributes:
      label: Log or crash report
      description: Paste latest.log or the crash report, or link to it on https://mclo.gs.
      render: text
